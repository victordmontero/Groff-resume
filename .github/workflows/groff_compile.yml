name: Groff CI

on:
  workflow_dispatch:
  pull_request:
    branches:
      - master

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: install-groff
      run: sudo apt update && sudo apt install groff
    - name: make
      run: make
    - name: Display outputs
      run: ls -R

    - uses: actions/upload-artifact@v7
      if: success()
      with:
        name: resume-output
        path: ./
